# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to the "main" branch.
#
# To use this workflow, you will need to complete the following set-up steps:
#
# 1. Create an ECR repository to store your images.
#    For example: `aws ecr create-repository --repository-name my-ecr-repo --region us-east-2`.
#    Replace the value of the `ECR_REPOSITORY` environment variable in the workflow below with your repository's name.
#    Replace the value of the `AWS_REGION` environment variable in the workflow below with your repository's region.
#
# 2. Create an ECS task definition, an ECS cluster, and an ECS service.
#    For example, follow the Getting Started guide on the ECS console:
#      https://us-east-2.console.aws.amazon.com/ecs/home?region=us-east-2#/firstRun
#    Replace the value of the `ECS_SERVICE` environment variable in the workflow below with the name you set for the Amazon ECS service.
#    Replace the value of the `ECS_CLUSTER` environment variable in the workflow below with the name you set for the cluster.
#
# 3. Store your ECS task definition as a JSON file in your repository.
#    The format should follow the output of `aws ecs register-task-definition --generate-cli-skeleton`.
#    Replace the value of the `ECS_TASK_DEFINITION` environment variable in the workflow below with the path to the JSON file.
#    Replace the value of the `CONTAINER_NAME` environment variable in the workflow below with the name of the container
#    in the `containerDefinitions` section of the task definition.
#
# 4. Store an IAM user access key in GitHub Actions secrets named `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
#    See the documentation for each action used below for the recommended IAM policies for this IAM user,
#    and best practices on handling the access key credentials.

name: Deploy to Amazon ECS

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}                   # set this to your preferred AWS region, e.g. us-west-1
  BRANCH: ${{ github.ref_name }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}/${{ github.ref_name }}           # set this to your Amazon ECR repository name
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}                 # set this to your Amazon ECS service name
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}                 # set this to your Amazon ECS cluster name
  ECS_TASK_DEFINITION: ${{ secrets.TASK_DEFINITION }}${{ github.ref_name }} # set this to the path to your Amazon ECS task definition
                                               # file, e.g. .aws/task-definition.json
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}${{ github.ref_name }}           # set this to the name of the container in the
                                               # containerDefinitions section of your task definition

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set image tag
      id: set-image-tag
      run: |
        COMMIT_SHORT=${GITHUB_SHA::7}
        DATE_TAG=$(date +%Y%m%d)
        echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_ENV
        echo "IMAGE_TAG=${DATE_TAG}.${COMMIT_SHORT}" >> $GITHUB_ENV

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build && mv build/libs/cicd-practice-0.0.1-SNAPSHOT.jar build/libs/app.jar

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ env.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        PORT_NUM: 8080
        HEAP_MEMORY: 1024
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        docker build \
                --build-arg HEAP_MEMORY=$HEAP_MEMORY \
                --build-arg PORT_NUM=$PORT_NUM \
                --build-arg VERSION_INFO=$IMAGE_TAG \
                -t $ECR_REGISTRY:$IMAGE_TAG .
        docker push $ECR_REGISTRY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Create new Task Definition revision
      id: task-def
      run: |
        IMAGE_TAG=${{ env.IMAGE_TAG }}
        IMAGE_URI="${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
        CONTAINER_DEF=$(jq --arg image "$IMAGE_URI" 'map(.image = $image)' container-definitions.json)
        aws ecs register-task-definition \
        --family ${{ env.ECS_TASK_DEFINITION }} \
        --network-mode awsvpc \
        --requires-compatibilities FARGATE \
        --cpu "512" \
        --memory "1024" \
        --execution-role-arn "arn:aws:iam::419819429021:role/ecsTaskExecutionRole" \
        --container-definitions "$CONTAINER_DEF"

    - name: Deploy to ECS service
      run: |
        REVISION=$(aws ecs describe-task-definition \
          --task-definition $TASK_DEFINITION \
          --query 'taskDefinition.revision' \
          --output text)
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --task-definition $TASK_DEFINITION:$REVISION \
          --desired-count 1 \
          --force-new-deployment
      env:
        ECS_CLUSTER:     ${{ env.ECS_CLUSTER }}
        ECS_SERVICE:     ${{ env.ECS_SERVICE }}
        TASK_DEFINITION: ${{ env.ECS_TASK_DEFINITION }}
